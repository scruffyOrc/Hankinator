[platformio]
default_envs = rpipico2w

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 768k
monitor_speed = 115200
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DHANKINATOR_ENABLE_WIFI_UPDATER=1
lib_deps =
    olikraus/U8g2
	adafruit/Adafruit NeoPixel
	teemuatlut/TMCStepper@^0.7.3

[env:rpipico2w]
board = rpipico2w

[env:rpipicow]
board = rpipicow

; Touchscreen integration target for the ILI9488/XPT2046 touch panel.
; It shares the production machine controller and enables the touch-driven
; winding workflow while leaving the normal Mini12864 target unchanged.
[env:rpipico2w_touch_diagnostics]
board = rpipico2w
lib_deps =
; Reuse the already validated local library copies from the touchscreen proof
; project.  This keeps this production test target reproducible even when
; PlatformIO's registry is unavailable.
lib_extra_dirs =
    C:\Users\crisd\SkeinWinder\HankWinderTouchTest\.pio\libdeps\rpipico2w
    .pio\libdeps\rpipico2w
build_flags =
    ${env.build_flags}
    -DHANKWINDER_TOUCH_DIAGNOSTICS=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=17
    -DTFT_DC=16
    -DTFT_RST=20
    -DSPI_FREQUENCY=10000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
